<style>
  :root{--bg-1:#FFF6EA;--bg-2:#FFE9D6;--bg-3:#FFD9BE;--primary:#E8542F;--primary-dark:#C63D1D;--ink:#5A3A26;--ink-2:#8A6A50}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    color:var(--ink);
    background:radial-gradient(1200px 500px at 50% -80px, #FFE3BE 0%, rgba(255,227,190,0) 60%), linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);

    text-align:center;padding:20px;
  }
  .ring{width:40px;height:40px;border:3px solid #FDE7DC;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:18px;font-weight:800;color:var(--primary-dark);letter-spacing:2px}
  p{font-size:13px;color:var(--ink-2);line-height:1.6}
  a{color:var(--primary);text-decoration:none;font-weight:700}
  a:hover{text-decoration:underline}
</style>
</head>
